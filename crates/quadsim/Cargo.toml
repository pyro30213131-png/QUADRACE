[package]
name = "quadsim"
version = "0.1.0"
edition = "2024"
# Minimum Rust version for everything in this crate. pyo3 and numpy 0.30 need 1.85; the
# benchmark library criterion 0.8 needs 1.86.
rust-version = "1.86"
description = "Batched quadrotor simulator, exposed to Python through PyO3"
publish = false

[lib]
# The compiled file is called _quadsim (.pyd on Windows, .so on Linux).
# "cdylib" means "shared library that Python can import".
# "rlib" is the normal Rust library form, which the benchmark needs to link against.
# The leading underscore is deliberate: the public Python name is `quadsim`,
# a thin package in python/quadsim/ that re-exports this module.
name = "_quadsim"
crate-type = ["cdylib", "rlib"]

[dependencies]
# pyo3 and numpy (the rust-numpy crate) must share the same 0.x number.
# numpy 0.30.0 declares `pyo3 = "^0.30.0"`.
pyo3 = "0.30"
numpy = "0.30"
# Spreads the environments over CPU threads. Approved in CLAUDE.md. 1.12.0 is the newest
# release (checked on crates.io on 2026-11-15) and needs Rust 1.80.
rayon = "1.12"
rand = "0.10"
rand_pcg = "0.10"

[dev-dependencies]
# The benchmark harness. Approved in CLAUDE.md.
criterion = "0.8"

[[bench]]
name = "step"
# criterion provides its own main(), so the default test harness must be turned off.
harness = false
